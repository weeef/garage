# Builds the Windows app on GitHub's servers, so a release needs no local Node.js or Windows PC.
#  - Push a tag like v1.14.0 (matching package.json): builds the installer and the portable .exe
#    and publishes them to the GitHub release for that tag, where the app's updater finds them.
#  - Run it by hand (Actions > Release > Run workflow): builds both .exe files and attaches them
#    to the run as a download, without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm test

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Garage-Log-Windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
